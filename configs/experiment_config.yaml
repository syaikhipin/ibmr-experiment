# AgriMemory v2 Experiment Configuration

# Model Configuration
models:
  backbone:
    name: "deepseek-ai/DeepSeek-V3-0324-TEE"
    api_base: "https://llm.chutes.ai/v1"
    temperature: 0.0
    max_tokens: 150

  vision_model:
    name: "zai-org/GLM-4.6V"  # For multimodal inference
    api_base: "https://llm.chutes.ai/v1"
    temperature: 0.3
    max_tokens: 512

  judge_models:  # Cross-model evaluation
    - "deepseek-ai/DeepSeek-V3-0324-TEE"
    - "gpt-4o-mini"
    - "gpt-4o"

  embedding:
    model: "michaelfeil/bge-small-en-v1.5"
    api_base: "https://nur-arifin-akbar--infinity-serve.modal.run/"
    dimension: 384

# Dataset Configuration
datasets:
  agriconvmem:
    train_samples: 350
    val_samples: 75
    test_samples: 75
    total: 500
    sessions_per_sample: [2, 3, 4]
    turns_per_session: [5, 7]

  agrihotpotqa:
    train_samples: 1400
    val_samples: 300
    test_samples: 300
    total: 2000
    context_paragraphs: [2, 3, 4]
    question_types:
      - bridge
      - comparison

# Memory Systems Configuration
memory_systems:

  # Neuroscientific Memory System (NMS) - Detailed Implementation
  nms:
    enabled: true

    # Working Memory Component
    working_memory:
      type: "attention_buffer"
      capacity: 7  # Miller's 7±2
      update_policy: "recency_importance"
      decay_rate: 0.1
      scoring:
        relevance_weight: 0.4
        recency_weight: 0.3
        importance_weight: 0.3

    # Episodic Memory Component
    episodic_memory:
      type: "temporal_graph"
      storage: "sqlite"
      indexing: "hierarchical_temporal"
      retrieval:
        method: "temporal_constrained_similarity"
        top_k: 5
        temporal_weight: 0.4
      features:
        - timestamp
        - session_id
        - conversation_context
        - entities_mentioned

    # Semantic Memory Component
    semantic_memory:
      type: "knowledge_graph"
      storage: "neo4j"  # Graph database
      schema:
        entities: ["disease", "crop", "symptom", "treatment", "pathogen"]
        relations: ["affects", "causes", "treats", "symptom_of"]
      retrieval:
        method: "graph_walk"
        max_hops: 3
        top_k: 10
      reasoning:
        enable_inference: true
        inference_rules:
          - "transitive_relation"
          - "symptom_aggregation"

    # Procedural Memory Component
    procedural_memory:
      type: "rule_based"
      storage: "json"
      templates:
        - name: "disease_diagnosis_workflow"
          steps: ["gather_symptoms", "identify_patterns", "match_disease", "verify_temporal"]
        - name: "treatment_selection"
          steps: ["identify_disease", "check_severity", "match_treatment", "verify_constraints"]

    # Memory Coordinator
    coordinator:
      type: "learned_router"  # Or "heuristic" for non-learned
      architecture: "lightweight_classifier"
      features:
        - query_type
        - temporal_markers
        - entity_types
        - question_complexity
      routing_strategy:
        disease_id: ["semantic", "episodic"]
        temporal: ["episodic", "working"]
        treatment: ["semantic", "procedural"]
        severity: ["episodic", "semantic"]
      aggregation: "weighted_fusion"
      weights:
        learnable: true
        init: "uniform"

  # GraphRAG Baseline
  graphrag:
    enabled: true
    chunk_size: 500
    overlap: 50
    graph_construction:
      method: "entity_relation_extraction"
      llm_based: true
      relation_types: ["disease_of", "symptom_of", "treats"]
    community_detection: "leiden"
    retrieval:
      local_search_k: 5
      global_search_k: 3

  # RAPTOR Baseline
  raptor:
    enabled: true
    clustering:
      method: "gaussian_mixture"
      levels: 3
    summarization:
      method: "llm"
      max_tokens: 256
    retrieval:
      tree_traversal: "top_down"
      top_k: 5

  # Adaptive RAG Memory (ARM)
  arm:
    enabled: true
    adaptive_retrieval: true
    query_classification:
      - simple_fact
      - temporal_query
      - multi_hop
    strategy_per_type:
      simple_fact:
        top_k: 3
        rerank: false
      temporal_query:
        top_k: 5
        temporal_filter: true
      multi_hop:
        top_k: 10
        iterative: true

  # Standard RAG
  rag:
    enabled: true
    chunk_size: 500
    overlap: 50
    top_k: 5
    reranking:
      enabled: true
      model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

  # Baseline
  baseline:
    enabled: true
    max_context_tokens: 15000

# Temporal Reasoning Module
temporal_module:
  enabled: true
  components:
    - temporal_expression_extraction
    - timeline_construction
    - temporal_relation_classification

  temporal_features:
    - absolute_time  # "2024-03-15"
    - relative_time  # "last week"
    - duration       # "for 3 days"
    - frequency      # "twice a month"

  timeline_index:
    enabled: true
    granularity: "day"
    retrieval: "temporal_proximity"

# Evaluation Configuration
evaluation:
  metrics:
    - f1_score
    - exact_match
    - bleu1
    - rouge_l
    - llm_judge

  statistical_testing:
    enabled: true
    method: "bootstrap"
    n_bootstrap: 1000
    confidence_level: 0.95
    multiple_runs: 3

  llm_judge:
    cross_model: true
    ensemble: true
    voting: "majority"

  ablation_studies:
    nms_components:
      - "working_only"
      - "episodic_only"
      - "semantic_only"
      - "procedural_only"
      - "no_coordinator"
      - "all_components"

  error_analysis:
    enabled: true
    categories:
      - temporal_confusion
      - entity_confusion
      - insufficient_context
      - hallucination

# Multimodal Evaluation
multimodal:
  enabled: true
  image_at_inference: true
  vision_encoder: "zai-org/GLM-4.6V"
  image_retrieval:
    enabled: true
    method: "CLIP"
    top_k: 3

# Data Generation
generation:
  model: "zai-org/GLM-4.6V"
  quality_control:
    human_validation_subset: 50
    automatic_checks:
      - factual_consistency
      - entity_extraction
      - temporal_consistency

  diversity:
    crop_types: 12
    disease_types: 30
    severity_levels: 3
    temporal_patterns: 5

# Logging and Output
logging:
  level: "INFO"
  save_predictions: true
  save_retrieved_context: true
  save_timing_info: true

# Reproducibility
reproducibility:
  random_seed: 42
  save_all_configs: true
  version_control: true
